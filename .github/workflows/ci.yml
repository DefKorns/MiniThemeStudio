name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  build-and-test:
    # SkiaSharp in Infrastructure only ships the Windows native libraries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MiniThemeStudio.slnx

      # warnings are errors (Directory.Build.props), so this also enforces the analyzers and .editorconfig style
      - name: Build
        run: dotnet build MiniThemeStudio.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MiniThemeStudio.slnx --configuration Release --no-build

  pre-commit:
    # the same hooks as .pre-commit-config.yaml, for commits made without them installed;
    # pinned so the ubuntu-latest migrations do not change the job unnoticed
    runs-on: ubuntu-24.04
    env:
      # .NET keeps its named mutexes in XDG_RUNTIME_DIR, which the runner points at a folder that does not exist
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
    steps:
      - name: Create the runtime folder
        run: mkdir -m 700 -p "$XDG_RUNTIME_DIR"

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run the hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
