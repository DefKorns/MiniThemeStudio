name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # .NET keeps its named mutexes in XDG_RUNTIME_DIR; on the Linux runners it points at a folder that does not
  # exist, so the jobs use their own (Windows ignores it)
  XDG_RUNTIME_DIR: /tmp/xdg-runtime

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    # Windows and Linux on every run; macOS minutes cost ten times more, so it runs only when work reaches
    # development or main, or when the workflow is started by hand
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest","ubuntu-24.04"]' || '["windows-latest","ubuntu-24.04","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Create the runtime folder
        if: runner.os != 'Windows'
        run: mkdir -m 700 -p "$XDG_RUNTIME_DIR"

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MiniThemeStudio.slnx

      # warnings are errors (Directory.Build.props), so this also enforces the analyzers and .editorconfig style
      - name: Build
        run: dotnet build MiniThemeStudio.slnx --configuration Release --no-restore

      # every test with its duration, so a test that is slow on one system shows in the log
      - name: Test
        run: dotnet test MiniThemeStudio.slnx --configuration Release --no-build --logger "console;verbosity=normal"

  pre-commit:
    # the same hooks as .pre-commit-config.yaml, for commits made without them installed;
    # pinned so the ubuntu-latest migrations do not change the job unnoticed
    runs-on: ubuntu-24.04
    steps:
      - name: Create the runtime folder
        run: mkdir -m 700 -p "$XDG_RUNTIME_DIR"

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run the hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
