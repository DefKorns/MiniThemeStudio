name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  build-and-test:
    # SkiaSharp in Infrastructure only ships the Windows native libraries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MiniThemeStudio.slnx

      # warnings are errors (Directory.Build.props), so this also enforces the analyzers and .editorconfig style
      - name: Build
        run: dotnet build MiniThemeStudio.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MiniThemeStudio.slnx --configuration Release --no-build

  pre-commit:
    # the same hooks as .pre-commit-config.yaml, for commits made without them installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: pre-commit/action@v3.0.1
